version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: twowheels-postgres
    environment:
      POSTGRES_DB: twowheels
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - twowheels-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: twowheels-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - twowheels-network

  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: twowheels-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: twowheels
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - twowheels-network

  # MongoDB Express (Web UI para MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: twowheels-mongo-express
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    networks:
      - twowheels-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: twowheels-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
    networks:
      - twowheels-network

volumes:
  postgres_data:
  mongodb_data:
  mongodb_config:
  rabbitmq_data:

networks:
  twowheels-network:
    driver: bridge